name: release-please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: run the checks on the release pull request
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(printf '%s' "$PR_JSON" | jq -r .headBranchName)
          for workflow in validate.yml security.yml ci.yml; do
            gh workflow run "$workflow" --repo "$REPO" --ref "$branch"
          done
      - name: build the release binaries
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$REPO" --ref master -f "tag=$TAG"
