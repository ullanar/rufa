name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to build, like v1.2.3
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: true
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            zig: false
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            zig: false
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
      - name: linux libraries for winit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-zigbuild
      - name: build with zig against glibc 2.28
        if: matrix.zig
        env:
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --release --target "$TARGET.2.28"
      - name: build
        if: ${{ !matrix.zig }}
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET"
      - name: archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name="rufa-$TAG-$TARGET"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/rufa.exe" "dist/$name/"
          else
            cp "target/$TARGET/release/rufa" "dist/$name/"
          fi
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
