name: ci

on:
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUFA_DATA_DIR: ${{ github.workspace }}/.sde

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every commit of the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          status=0
          while IFS= read -r subject; do
            if printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "ok   $subject"
            else
              echo "bad  $subject"
              status=1
            fi
          done < <(git log --format=%s "$BASE".."$HEAD")
          exit "$status"

  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: linux libraries for winit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: game data for the engine tests
        run: |
          mkdir -p "$RUFA_DATA_DIR"
          curl -sSfL -o "$RUFA_DATA_DIR/sde.dat" https://github.com/EVEShipFit/sde-patched/releases/latest/download/sde.dat
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
